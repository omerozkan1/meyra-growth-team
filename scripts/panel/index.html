<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meyra Panel</title>
<style>
  :root { --bg:#f6f4ee; --card:#fff; --ink:#14202e; --muted:#5e6b78; --line:#e3dfd4; --brand:#0e1a2b; --green:#2e7d6b; --gold:#b8934f; --red:#b3362f; --amber:#a86a12; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0d141d; --card:#151f2b; --ink:#e9edf2; --muted:#9aa7b4; --line:#253242; --brand:#e9edf2; --green:#4fb39a; --gold:#d6b16b; --red:#e2675f; --amber:#e0a14a; } }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 -apple-system, system-ui, "Segoe UI", sans-serif; background:var(--bg); color:var(--ink); }
  header { display:flex; align-items:center; gap:12px; padding:16px 24px; border-bottom:1px solid var(--line); background:var(--card); position:sticky; top:0; z-index:2; }
  header h1 { font-size:18px; margin:0; }
  header .who { margin-left:auto; color:var(--muted); font-size:13px; }
  nav { display:flex; gap:4px; padding:12px 24px 0; flex-wrap:wrap; }
  nav button { border:1px solid var(--line); background:var(--card); color:var(--ink); padding:8px 14px; border-radius:8px; cursor:pointer; font:inherit; }
  nav button.on { background:var(--brand); color:var(--bg); border-color:var(--brand); }
  main { padding:16px 24px 48px; max-width:1200px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; }
  .grid { display:grid; grid-template-columns: 300px 1fr; gap:20px; }
  @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } header, nav, main { padding-left:16px; padding-right:16px; } }
  video { width:100%; max-width:300px; border-radius:10px; background:#000; aspect-ratio:9/16; }
  .pill { display:inline-block; padding:2px 10px; border-radius:99px; font-size:12px; font-weight:600; border:1px solid currentColor; }
  .ok { color:var(--green); } .bad { color:var(--red); } .warn { color:var(--amber); } .muted { color:var(--muted); }
  .tabs { display:flex; gap:6px; margin:8px 0; } .tabs button { font:inherit; font-size:13px; border:1px solid var(--line); background:transparent; color:var(--ink); border-radius:6px; padding:4px 10px; cursor:pointer; }
  .tabs button.on { border-color:var(--ink); }
  pre { white-space:pre-wrap; background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:12px; font:13px/1.5 ui-monospace, Menlo, monospace; margin:0; max-height:420px; overflow:auto; }
  .actions { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
  .btn { font:inherit; padding:9px 16px; border-radius:8px; border:0; cursor:pointer; font-weight:600; }
  .btn.approve { background:var(--green); color:#fff; } .btn.reject { background:transparent; color:var(--red); border:1px solid var(--red); }
  .btn:disabled { opacity:.45; cursor:not-allowed; }
  ul.tight { margin:6px 0; padding-left:18px; } table { width:100%; border-collapse:collapse; } td, th { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); font-size:14px; vertical-align:top; }
  .notice { border-left:4px solid var(--amber); }
  h2 { font-size:16px; margin:0 0 8px; } h3 { font-size:14px; margin:12px 0 4px; }
</style>
</head>
<body>
<header><h1>Meyra · Büyüme Paneli</h1><span class="pill warn">DRY-RUN · paylaşım kapalı</span><span class="who">Onaylayan: <b>__OWNER__</b></span></header>
<nav id="nav"></nav>
<main id="main"><p class="muted">Yükleniyor…</p></main>
<script>
const CSRF = "__CSRF__";
const TABS = [["today","Bugün"],["pending","Onay bekleyenler"],["decided","Kararlar"],["reports","Raporlar"]];
let S = null, tab = "today";
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = iso => iso ? new Date(iso).toLocaleString("tr-TR", {timeZone:"Europe/Istanbul"}) : "-";
function nav(){ document.getElementById("nav").innerHTML = TABS.map(([k,l]) => `<button class="${k===tab?"on":""}" onclick="go('${k}')">${l}${k==="pending"&&S?` (${S.pending.length})`:""}</button>`).join(""); }
function go(k){ tab=k; render(); }
async function load(){ S = await (await fetch("/api/state")).json(); render(); }
function stepRow(s){ const c = s.status==="ok"?"ok":s.status==="skipped"?"muted":s.status==="warn"?"warn":"bad"; return `<tr><td>${esc(s.name)}</td><td><span class="pill ${c}">${esc(s.status)}</span></td><td class="muted">${esc(s.detail||"")}</td><td class="muted">${s.duration_s!=null?s.duration_s+" sn":""}</td></tr>`; }
function today(){
  const r = S.runs[0];
  let h = S.keyReady ? "" : `<div class="card notice"><b>Kurulum gerekli:</b> onay anahtarı yok. Terminalde bir kez <code>npm run owner:setup</code> çalıştırın.</div>`;
  if (!r) return h + `<div class="card">Henüz günlük çalışma yok. İlk otomatik çalışma 09:00'da.</div>`;
  const st = r.status==="ok"?"ok":r.status==="partial"?"warn":"bad";
  h += `<div class="card"><h2>${esc(r.date)} günlük çalışma <span class="pill ${st}">${esc(r.status)}</span> ${r.mode==="test"?'<span class="pill muted">test</span>':""}</h2>
  <p class="muted">Başladı ${fmt(r.started_at)} · Bitti ${fmt(r.finished_at)} · Tetikleyen: ${esc(r.trigger||"-")}</p>
  <table><tr><th>Adım</th><th>Durum</th><th>Detay</th><th>Süre</th></tr>${(r.steps||[]).map(stepRow).join("")}</table></div>`;
  if (r.ceo_summary) h += `<div class="card"><h2>Growth CEO özeti</h2><pre>${esc(r.ceo_summary)}</pre></div>`;
  if ((r.errors||[]).length) h += `<div class="card"><h2 class="bad">Hatalar</h2><ul class="tight">${r.errors.map(e=>`<li>${esc(e)}</li>`).join("")}</ul></div>`;
  return h;
}
function captions(p){
  const id = p.id; const c = p.captions||{};
  return `<div class="tabs">${["instagram","tiktok","youtube"].map((k,i)=>`<button class="${i?"":"on"}" onclick="capTab(this,'${id}','${k}')">${k}</button>`).join("")}</div><pre id="cap-${id}">${esc(c.instagram)}</pre>`;
}
window.capTab = (btn,id,k) => { btn.parentNode.querySelectorAll("button").forEach(b=>b.classList.remove("on")); btn.classList.add("on"); document.getElementById("cap-"+id).textContent = (S.pending.find(p=>p.id===id).captions||{})[k]||""; };
function pending(){
  if (!S.pending.length) return `<div class="card">Onay bekleyen içerik yok.</div>`;
  return S.pending.map(p => {
    const v = p.video||{}, qc = p.qc||{}, ready = qc.status==="ready" && S.keyReady;
    return `<div class="card"><div class="grid"><div>${v.file?`<video controls preload="metadata" src="/media/${esc(p.id)}.mp4"></video>`:"<p class='muted'>Video yok</p>"}
      <p class="muted">${esc(v.kind||"-")} · ${v.duration_s||"-"} sn · ses: ${esc(v.voice||"-")}</p></div>
      <div><h2>${esc(p.id)} · ${esc(p.title)}</h2>
      <p class="muted">${esc(p.pillar)} · ${esc((p.platforms||[]).join(", "))} · hedef ${esc(p.publish_target)} · paketlendi ${fmt(p.packaged_at)}</p>
      <p>Kalite kontrol: <span class="pill ${qc.status==="ready"?"ok":"bad"}">${qc.status==="ready"?"HAZIR":"ENGELLİ"}</span> ${v.kind!=="final"?'<span class="pill warn">TASLAK VİDEO: yayınlanamaz</span>':""}</p>
      ${(qc.reasons||[]).length?`<ul class="tight bad">${qc.reasons.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:""}
      ${(v.missing_assets||[]).length?`<h3>Eksik kaynaklar (${v.missing_assets.length})</h3><ul class="tight">${v.missing_assets.map(m=>`<li>Bölüm ${m.segment}: ${esc(m.need)}: <span class="muted">${esc(m.description)}</span></li>`).join("")}</ul>`:""}
      <h3>Platform açıklamaları</h3>${captions(p)}
      <div class="actions"><button class="btn approve" ${ready?"":"disabled"} onclick="decide('${p.id}','approve')">Onayla</button>
      <button class="btn reject" ${S.keyReady?"":"disabled"} onclick="decide('${p.id}','reject')">Reddet</button></div>
      <p class="muted" style="font-size:13px">Onay, dosya + açıklama + video özetini imzalar. Sonradan değişiklik olursa onay geçersiz olur. Onay yayın yapmaz.</p>
      </div></div></div>`; }).join("");
}
async function decide(id, decision){
  let reason = null;
  if (decision==="reject") { reason = prompt(id+" neden reddediliyor?"); if (reason===null) return; }
  else if (!confirm(id+" onaylansın mı? (Yayın yapılmaz; taslak videolar yayınlanamaz.)")) return;
  const r = await fetch("/api/decision", {method:"POST", headers:{"Content-Type":"application/json","X-Meyra-CSRF":CSRF}, body: JSON.stringify({id, decision, reason})});
  const j = await r.json(); alert(j.ok ? `${id}: ${j.decision}` : `Hata: ${j.error}`); load();
}
function decided(){
  const rows = [...S.approved.map(a=>({...a,kind:"approved"})), ...S.rejected.map(a=>({...a,kind:"rejected"}))].sort((a,b)=>String(b.at).localeCompare(a.at));
  if (!rows.length) return `<div class="card">Henüz karar yok.</div>`;
  return `<div class="card"><table><tr><th>ID</th><th>Karar</th><th>Kim / ne zaman</th><th>İmza ve dosyalar</th><th>Not</th></tr>${rows.map(r=>`<tr><td>${esc(r.id)}</td><td><span class="pill ${r.kind==="approved"?"ok":"bad"}">${r.kind==="approved"?"onaylandı":"reddedildi"}</span></td><td>${esc(r.by)}<br><span class="muted">${fmt(r.at)}</span></td><td>${r.kind==="approved"?(r.valid?'<span class="ok">geçerli</span>':'<span class="bad">geçersiz (değişmiş)</span>'):"-"}</td><td class="muted">${esc(r.reason||(r.video_kind&&r.video_kind!=="final"?"taslak video":""))}</td></tr>`).join("")}</table></div>`;
}
function reports(){
  if (!S.reports.length) return `<div class="card">Rapor yok.</div>`;
  return `<div class="card"><div class="tabs" style="flex-wrap:wrap">${S.reports.map((d,i)=>`<button class="${i?"":"on"}" onclick="showReport(this,'${d}')">${d}</button>`).join("")}</div><pre id="rep">…</pre></div>`;
}
window.showReport = async (btn,d) => { if (btn){ btn.parentNode.querySelectorAll("button").forEach(b=>b.classList.remove("on")); btn.classList.add("on"); } document.getElementById("rep").textContent = await (await fetch("/api/report?date="+d)).text(); };
function render(){ nav(); const m = document.getElementById("main"); m.innerHTML = ({today,pending,decided,reports})[tab](); if (tab==="reports" && S.reports[0]) showReport(null, S.reports[0]); }
load(); setInterval(load, 60000);
</script>
</body>
</html>
